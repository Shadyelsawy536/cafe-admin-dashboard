name: Checkout idempotency migration test

on:
  pull_request:
    paths:
      - "supabase/migrations/20261019152000_add_checkout_idempotency_rpc.sql"
      - ".github/workflows/checkout-idempotency-db-test.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20261019152000_add_checkout_idempotency_rpc.sql"
      - ".github/workflows/checkout-idempotency-db-test.yml"

permissions:
  contents: read

jobs:
  postgres-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: checkout_test
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare minimal Supabase-compatible test schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create schema if not exists private;
          create role anon;
          create role authenticated;

          create type public.delivery_type as enum ('delivery', 'pickup');
          create type public.payment_method as enum ('cash', 'visa');

          create table public.customers (
            id uuid primary key,
            user_id uuid not null,
            restaurant_id uuid not null
          );
          create table public.orders (id uuid primary key);

          create function auth.uid() returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          -- Test double for the production order writer. The idempotency
          -- migration calls this existing RPC; the test verifies wrapper
          -- retry behavior without writing to production or a real gateway.
          create function public.place_order_with_location(
            uuid, uuid, text, text, public.delivery_type, text, text,
            public.payment_method, jsonb, text, text, timestamptz,
            double precision, double precision
          ) returns uuid
          language plpgsql
          as $$
          declare v_order_id uuid := gen_random_uuid();
          begin
            insert into public.orders(id) values (v_order_id);
            return v_order_id;
          end;
          $$;

          insert into public.customers(id, user_id, restaurant_id) values (
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc'
          );
          SQL

      - name: Apply production checkout idempotency migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019152000_add_checkout_idempotency_rpc.sql

      - name: Verify idempotent retries, changed payload rejection, and permissions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set request.jwt.claim.sub = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';

          do $$
          declare
            v_first uuid;
            v_retry uuid;
            v_other uuid;
            v_orders bigint;
            v_rejected boolean := false;
          begin
            v_first := public.place_order_with_location_idempotent(
              'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              'Test Customer', '01000000000', 'pickup', 'Test address', null,
              'cash', '[{"product_id":"test-product","quantity":1}]'::jsonb,
              null, '', null, null, null
            );

            v_retry := public.place_order_with_location_idempotent(
              'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              'Test Customer', '01000000000', 'pickup', 'Test address', null,
              'cash', '[{"product_id":"test-product","quantity":1}]'::jsonb,
              null, '', null, null, null
            );

            if v_first is distinct from v_retry then
              raise exception 'FAIL: retry returned a different order ID';
            end if;

            select count(*) into v_orders from public.orders;
            if v_orders <> 1 then
              raise exception 'FAIL: expected exactly one order after retry, got %', v_orders;
            end if;

            begin
              perform public.place_order_with_location_idempotent(
                'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
                'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
                'Test Customer', '01000000000', 'pickup', 'Changed address', null,
                'cash', '[{"product_id":"test-product","quantity":1}]'::jsonb,
                null, '', null, null, null
              );
            exception when others then
              if sqlerrm like '%different order request%' then
                v_rejected := true;
              else
                raise;
              end if;
            end;

            if not v_rejected then
              raise exception 'FAIL: same key with changed payload was not rejected';
            end if;

            v_other := public.place_order_with_location_idempotent(
              'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              'Test Customer', '01000000000', 'pickup', 'Another address', null,
              'cash', '[{"product_id":"test-product","quantity":1}]'::jsonb,
              null, '', null, null, null
            );

            if v_other = v_first then
              raise exception 'FAIL: distinct checkout key reused the previous order';
            end if;

            select count(*) into v_orders from public.orders;
            if v_orders <> 2 then
              raise exception 'FAIL: expected exactly two orders after distinct checkout, got %', v_orders;
            end if;

            if has_function_privilege('anon', to_regprocedure(
              'public.place_order_with_location_idempotent(uuid,uuid,uuid,text,text,public.delivery_type,text,text,public.payment_method,jsonb,text,text,timestamp with time zone,double precision,double precision)'
            ), 'EXECUTE') then
              raise exception 'FAIL: anon can execute idempotent checkout';
            end if;

            if not has_function_privilege('authenticated', to_regprocedure(
              'public.place_order_with_location_idempotent(uuid,uuid,uuid,text,text,public.delivery_type,text,text,public.payment_method,jsonb,text,text,timestamp with time zone,double precision,double precision)'
            ), 'EXECUTE') then
              raise exception 'FAIL: authenticated cannot execute idempotent checkout';
            end if;

            raise notice 'PASS: idempotent retry, payload mismatch, distinct key, and RPC grants';
          end;
          $$;
          SQL
