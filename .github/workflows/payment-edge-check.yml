name: Payment Edge Function checks

on:
  pull_request:
    paths:
      - "supabase/functions/create-payment/**"
      - "supabase/functions/payment-webhook/**"
      - ".github/workflows/payment-edge-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check create-payment
        run: deno check supabase/functions/create-payment/index.ts

      - name: Type-check payment-webhook
        run: deno check supabase/functions/payment-webhook/index.ts
